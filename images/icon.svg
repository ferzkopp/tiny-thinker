<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tiny Thinker">
  <style>
    .eye, .star { transform-box: fill-box; transform-origin: center; }
    /* Irregular timings within one long cycle make blinks feel random: single blink, double blink, then a wink. */
    .eye-l { animation: blink-l 11s infinite; }
    .eye-r { animation: blink-r 11s infinite; }
    .star { animation: twinkle 4.7s ease-in-out infinite; }
    @keyframes blink-l {
      0%, 1.6%, 36%, 37.6%, 40%, 41.6%, 100% { transform: scaleY(1); }
      0.8%, 36.8%, 40.8% { transform: scaleY(0.1); }
    }
    @keyframes blink-r {
      0%, 1.6%, 36%, 37.6%, 40%, 41.6%, 76%, 78.4%, 100% { transform: scaleY(1); }
      0.8%, 36.8%, 40.8%, 76.6%, 77.8% { transform: scaleY(0.1); }
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(0.75) rotate(20deg); opacity: 0.7; }
    }
    @media (prefers-reduced-motion: reduce) { .eye-l, .eye-r, .star { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#2f6fde"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="45" cy="15" r="2.4" fill="#fff" opacity=".75"/>
  <circle cx="50.5" cy="10" r="3.4" fill="#fff" opacity=".85"/>
  <path class="star" d="M51 2.8l1.4 3.4 3.6.4-2.7 2.4.8 3.5-3.1-1.8-3.1 1.8.8-3.5-2.7-2.4 3.6-.4z" fill="#ffd166"/>
  <path d="M22 21h20a11 11 0 0 1 11 11v8a11 11 0 0 1-11 11H22a11 11 0 0 1-11-11v-8a11 11 0 0 1 11-11z" fill="#ffd166"/>
  <path d="M23 21c1-5 5-8 9-8s8 3 9 8" fill="none" stroke="#ffd166" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M27 15.5c1.5 2 1.5 4 0 5.5M37 15.5c-1.5 2-1.5 4 0 5.5" fill="none" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/>
  <g class="eye eye-l">
    <circle cx="24.5" cy="34" r="4.2" fill="#1c2430"/>
    <circle cx="26" cy="32.5" r="1.4" fill="#fff"/>
  </g>
  <g class="eye eye-r">
    <circle cx="39.5" cy="34" r="4.2" fill="#1c2430"/>
    <circle cx="41" cy="32.5" r="1.4" fill="#fff"/>
  </g>
  <path d="M27 43.5q5 3.5 10 0" fill="none" stroke="#1c2430" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="18.5" cy="41" r="2.4" fill="#f28482" opacity=".7"/>
  <circle cx="45.5" cy="41" r="2.4" fill="#f28482" opacity=".7"/>
  <rect x="24" y="51" width="16" height="6" rx="3" fill="#ffd166"/>
</svg>
